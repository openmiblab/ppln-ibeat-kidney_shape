
name: kshape
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10 # python>3.10 is more risky on HPC
  - numpy=2.2.6
  - pandas=2.3.3
  - pytorch=2.5.1  # limited to 2.8.0 as per instruction on nnUNET website
  - torchvision=0.20.1
  - torchaudio=2.5.1
  - pytorch-cuda=11.8 
  - pip=25.2

  - pip:
      - nnunetv2==2.6.2
      - -e .
